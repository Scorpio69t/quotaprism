[package]
name = "quotaprism-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prism-core = { path = "../../../crates/prism-core" }
prism-providers = { path = "../../../crates/prism-providers" }
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
