[workspace]
members = [
    "crates/prism-core",
    "crates/prism-providers",
    "crates/prism-storage",
    "crates/prism-security",
    "crates/prism-app",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
tempfile = "3"
keyring = "3"
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
