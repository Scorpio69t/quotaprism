[workspace]
members = ["crates/prism-core", "crates/prism-providers", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
